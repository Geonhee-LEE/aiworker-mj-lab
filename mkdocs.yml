site_name: "ffw-sh5-grasp"
site_author: ggh-png
repo_url: https://github.com/ggh-png/ffw-sh5-grasp
site_url: https://ggh-png.github.io/ffw-sh5-grasp/
site_description: "ROBOTIS FFW-SH5의 ROS-free MuJoCo 텔레오퍼레이션 — whole-body/arm-only IK, 실제 스워브 물리, 양손 grasp, reactive collision avoidance와 검증 문서."

theme:
    name: material
    language: ko
    palette:
        - media: "(prefers-color-scheme: light)"
          scheme: default
          primary: indigo
          accent: indigo
          toggle:
              icon: material/weather-night
              name: 다크 모드로 전환
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          primary: indigo
          accent: indigo
          toggle:
              icon: material/weather-sunny
              name: 라이트 모드로 전환
    features:
        - navigation.tabs
        - navigation.sections
        - navigation.top
        - navigation.indexes
        - navigation.footer
        - navigation.tracking
        - content.code.copy
        - content.code.annotate
        - search.highlight
        - search.suggest
        - toc.follow

use_directory_urls: false

markdown_extensions:
    - meta
    - attr_list
    - md_in_html
    - admonition
    - def_list
    - tables
    - footnotes
    - toc:
        permalink: true
    - pymdownx.details
    - pymdownx.highlight:
        anchor_linenums: true
    - pymdownx.inlinehilite
    - pymdownx.snippets
    - pymdownx.superfences:
        custom_fences:
            - name: mermaid
              class: mermaid
              format: !!python/name:pymdownx.superfences.fence_code_format
    - pymdownx.tabbed:
        alternate_style: true
    - pymdownx.arithmatex:
        generic: true
    - pymdownx.emoji:
        emoji_index: !!python/name:material.extensions.emoji.twemoji
        emoji_generator: !!python/name:material.extensions.emoji.to_svg

copyright: Copyright &copy; 2026 ggh-png

extra:
    social:
        - icon: fontawesome/brands/github
          link: https://github.com/ggh-png/ffw-sh5-grasp

extra_css:
    - css/custom.css

extra_javascript:
    - javascripts/mathjax.js
    - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
    - 홈: index.md
    - 처음 사용하기:
        - 빠른 시작: getting-started.md
        - YAML 파라미터 설정: configuration.md
        - 화면과 조작: run.md
        - 모드 선택: control-modes.md
        - 문제 해결: troubleshooting.md
    - 시스템 이해와 개발:
        - 전체 안내: guide/index.md
        - 시스템 기초:
            - 동작 원리: concepts.md
            - 아키텍처와 데이터 흐름: overview.md
            - 코드 분리 기준: guide/code-architecture.md
            - MuJoCo 기본 용어: guide/00-basics.md
        - 애플리케이션:
            - 앱 조립과 물리 루프: guide/teleop_app.md
            - 목표와 좌표 변환: guide/teleop_targets.md
        - 시각화:
            - UI 패널: guide/teleop_ui.md
            - 렌더링과 Gizmo: guide/teleop_render.md
        - 기구학과 수학:
            - 전체 안내: guide/kinematics.md
            - 구조와 정기구학:
                - Kinematic Tree: guide/kinematic-tree.md
                - FK와 Jacobian: guide/forward-kinematics.md
            - 회전과 충돌:
                - Quaternion과 자세 오차: guide/quaternion-math.md
                - Collision distance와 gradient: guide/collision-kinematics.md
            - 역기구학:
                - Differential IK 수학: guide/ik-math.md
        - 제어:
            - 전신 IK와 충돌 회피: guide/whole_body_ik.md
            - 팔 토크 제어: guide/arm_control.md
            - 모바일 스워브 제어: guide/base_teleop.md
            - 손 파지와 접촉 판정: guide/grasp.md
        - 검증과 확장:
            - 테스트와 검증: testing.md
            - 개발 체크리스트: guide/pitfalls.md
            - 모방학습 데이터와 실기 전환: guide/imitation-sim2real.md
    - API 레퍼런스:
        - 전체 안내: api/index.md
        - 빠른 API 찾기: api/quick-reference.md
        - 설정: api/config.md
        - 애플리케이션:
            - 전체 안내: api/application.md
            - 텔레옵 앱: api/application-teleop.md
            - 목표 좌표: api/application-targets.md
        - 기구학:
            - 전체 안내: api/kinematics.md
            - 회전 수학: api/kinematics-rotations.md
            - Pose 오차와 Task: api/kinematics-tasks.md
            - 속도 제약조건: api/kinematics-constraints.md
            - Tree와 FK: api/kinematics-tree.md
            - Differential IK Solver: api/kinematics-solver.md
            - QP 수치 구현: api/kinematics-optimization.md
            - 충돌 기구학: api/kinematics-collision.md
            - Legacy 호환: api/kinematics-legacy.md
        - 제어:
            - 전체 안내: api/control.md
            - 전신 IK: api/control-whole-body.md
            - 양손 상대 Pose: api/control-bimanual.md
            - 팔 토크: api/control-arm.md
            - 모바일 베이스: api/control-base.md
            - 손 파지: api/control-grasp.md
        - 시각화:
            - 전체 안내: api/visualization.md
            - 렌더링: api/visualization-render.md
            - UI: api/visualization-ui.md
        - 공통 MuJoCo 유틸: api/mujoco-utils.md
    - 릴리스 기록: releases.md

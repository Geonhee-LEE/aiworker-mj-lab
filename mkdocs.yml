site_name: "aiworker-mj-lab"
site_author: ggh-png
repo_url: https://github.com/ggh-png/aiworker-mj-lab
site_url: https://ggh-png.github.io/aiworker-mj-lab/
site_description: "ROBOTIS FFW-SH5의 ROS-free MuJoCo 텔레오퍼레이션과 ACT 모방학습 — whole-body/arm-only IK, 색상 분류, joint/task policy, PTE와 검증 문서."

theme:
    name: material
    language: ko
    palette:
        - media: "(prefers-color-scheme: light)"
          scheme: default
          primary: indigo
          accent: indigo
          toggle:
              icon: material/weather-night
              name: 다크 모드로 전환
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          primary: indigo
          accent: indigo
          toggle:
              icon: material/weather-sunny
              name: 라이트 모드로 전환
    features:
        - navigation.tabs
        - navigation.sections
        - navigation.top
        - navigation.indexes
        - navigation.footer
        - navigation.tracking
        - content.code.copy
        - content.code.annotate
        - search.highlight
        - search.suggest
        - toc.follow

use_directory_urls: false

markdown_extensions:
    - meta
    - attr_list
    - md_in_html
    - admonition
    - def_list
    - tables
    - footnotes
    - toc:
        permalink: true
    - pymdownx.details
    - pymdownx.highlight:
        anchor_linenums: true
    - pymdownx.inlinehilite
    - pymdownx.snippets
    - pymdownx.superfences:
        custom_fences:
            - name: mermaid
              class: mermaid
              format: !!python/name:pymdownx.superfences.fence_code_format
    - pymdownx.tabbed:
        alternate_style: true
    - pymdownx.arithmatex:
        generic: true
    - pymdownx.emoji:
        emoji_index: !!python/name:material.extensions.emoji.twemoji
        emoji_generator: !!python/name:material.extensions.emoji.to_svg

copyright: Copyright &copy; 2026 ggh-png

extra:
    social:
        - icon: fontawesome/brands/github
          link: https://github.com/ggh-png/aiworker-mj-lab

extra_css:
    - css/custom.css

extra_javascript:
    - javascripts/mathjax.js
    - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
    - 홈: index.md
    - 처음 사용하기:
        - 빠른 시작: getting-started.md
        - 모방학습 명령어: imitation-commands.md
        - YAML 파라미터 설정: configuration.md
        - 화면과 조작: run.md
        - 모드 선택: control-modes.md
        - 문제 해결: troubleshooting.md
    - 시스템 이해와 개발:
        - 전체 안내: guide/index.md
        - 시스템 기초:
            - 시스템 구조와 데이터 흐름: overview.md
            - 프로젝트 파일 트리와 역할: guide/project-tree.md
            - 소스 구조와 정리 원칙: guide/source-layout.md
        - 애플리케이션:
            - 앱 실행과 목표 좌표: guide/teleop_app.md
        - 시각화:
            - UI와 렌더링: guide/teleop_ui.md
        - 기구학과 수학:
            - 전체 안내: guide/kinematics.md
            - 구조와 정기구학:
                - Tree, FK와 Jacobian: guide/forward-kinematics.md
            - 회전과 충돌:
                - Quaternion과 자세 오차: guide/quaternion-math.md
                - Collision distance와 gradient: guide/collision-kinematics.md
            - 역기구학:
                - Differential IK 수학: guide/ik-math.md
        - 제어:
            - 전신 IK와 충돌 회피: guide/whole_body_ik.md
            - 팔 토크 제어: guide/arm_control.md
            - 모바일 스워브 제어: guide/base_teleop.md
            - 손 파지와 접촉 판정: guide/grasp.md
        - 모방학습 (IL):
            - 전체 안내: guide/il/index.md
            - 기반 지식:
                - 행동 복제와 데이터: guide/il/foundations.md
                - CNN과 ResNet18: guide/il/vision-encoder.md
                - RNN과 Transformer: guide/il/sequence-models.md
                - VAE와 CVAE: guide/il/cvae.md
            - ACT:
                - ACT 아키텍처: guide/il/act.md
                - 논문과 현재 구현 대응: guide/act-implementation.md
                - Joint/Task 학습과 PTE 평가: modular-act-training.md
                - ACT 연구 보고서: research-report.md
                - 평가 결과 상세 분석: evaluation-results.md
                - 코드 구조: guide/imitation-code-structure.md
                - 데이터와 실기 전환: guide/imitation-sim2real.md
                - Hugging Face 배포: huggingface.md
        - 검증과 확장:
            - 테스트와 검증: testing.md
            - 개발 체크리스트: guide/pitfalls.md
    - API 레퍼런스:
        - 전체 안내: api/index.md
        - 설정: api/config.md
        - 애플리케이션: api/application.md
        - 기구학: api/kinematics.md
        - 제어: api/control.md
        - 시각화: api/visualization.md
    - 릴리스 기록: releases.md

# FFW-SH5 실행 및 알고리즘 조절값의 기본 설정이다.
# 단위는 키 이름 또는 각 항목의 주석에 표시한다.
schema_version: 1

application:
  # 실행할 MJCF 모델과 초기 키프레임이다. 상대 경로는 저장소 루트를 기준으로 한다.
  model_path: models/full_scene.xml
  home_keyframe: home
  window:
    width: 1440
    height: 900
  # 화면 한 프레임에서 제어 명령을 갱신하는 빈도다.
  loop_hz: 25.0
  # 양팔의 기본 관절 자세다. 순서는 1번 관절부터 7번 관절까지이며 단위는 rad이다.
  home_arm_position_rad: [0.0, 0.0, 0.0, -1.5707963267948966, 0.0, 0.0, 0.0]
  # 리프트 목표 범위와 키보드 조그 속도다.
  lift_range_m: [-0.5, 0.0]
  lift_jog_speed_m_s: 0.3
  # 양손 가상 물체 마커의 초기 월드 위치다.
  virtual_object_home_position_m: [0.4055, 0.0, 0.9716]
  # 슬라이더가 급변할 때 프레임마다 허용하는 최대 목표 변화량이다.
  max_position_step_per_frame_m: 0.03
  max_rotation_step_per_frame_deg: 8.0
  # 캔 초기화 시 각 축에 적용하는 균등분포 위치 잡음이다.
  can_reset_noise_m: 0.02
  # 원터치 파지 명령이 0에서 1까지 변하는 초당 변화량이다.
  grasp_command_rate_per_s: 1.0
  # 양손 가상 물체 이동 UI의 기본 이동 시간이다.
  cyclo_move_time_s: 2.0
  # 수동 주행 해제 후 정지로 판정하는 차체 속도 임계값이다.
  manual_stop_linear_speed_m_s: 0.01
  manual_stop_angular_speed_rad_s: 0.02

arm_control:
  # 팔 motor 액추에이터의 소프트웨어 PD 이득이다.
  proportional_gain: 600.0
  derivative_gain: 40.0

kinematics:
  # 단일 사이트 위치 우선 DLS IK의 감쇠와 반복 설정이다.
  damping: 0.05
  max_joint_delta_rad: 0.07
  max_iterations: 70
  position_tolerance_m: 0.0001
  orientation_tolerance_rad: 0.001
  orientation_cost_weight: 0.3
  backtracking_steps: 6
  backtracking_ratio: 0.5
  multistart:
    restarts: 8
    max_iterations: 250
    success_position_tolerance_m: 0.005
    success_orientation_tolerance_deg: 5.0

whole_body_ik:
  # 말단 위치·방향 작업의 가중치와 오차 피드백 이득이다.
  position_weight: 10.0
  orientation_weight: 5.0
  position_gain: 10.0
  orientation_gain: 9.0
  linear_velocity_damping: 0.0
  angular_velocity_damping: 0.0
  posture_gain: 1.0
  # 관절 한계 CBF 설정이다.
  joint_limit_margin_rad: 0.02
  joint_limit_gain: 5.0
  # 양손 상대 자세를 유지하는 작업의 가중치다.
  rigid_grasp_weight: 250.0
  # 충돌 거리 CBF 설정이다. buffer는 safe_distance보다 커야 한다.
  collision_avoidance: true
  collision_buffer_m: 0.03
  collision_safe_distance_m: 0.01
  collision_barrier_gain: 50.0
  collision_slack_weight: 1000.0
  # 말단과 베이스 명령의 속도·가속도 상한이다.
  max_task_linear_speed_m_s: 1.2
  max_task_angular_speed_rad_s: 3.0
  base_linear_acceleration_limit_m_s2: 8.0
  base_angular_acceleration_limit_rad_s2: 4.0
  base_position_fade_distance_m: 0.08
  base_orientation_fade_angle_rad: 0.25
  # 제어 자유도별 속도 상한이다. arm_default는 각 팔 관절에 공통 적용한다.
  velocity_limits:
    base_x: 0.55
    base_y: 0.55
    base_yaw: 1.4
    lift_joint: 0.35
    arm_default: 4.5
  # [base_x, base_y, base_yaw, lift]와 14개 팔 관절의 정규화 비용이다.
  damping_weights:
    base_lift: [0.25, 0.25, 0.20, 0.12]
    arm: 0.045
  posture_weights:
    base_lift: [0.0, 0.0, 0.0, 0.10]
    arm: 0.025
  # 양손 공통 이동을 베이스 명령으로 바꾸는 서보 설정이다.
  common_base:
    position_gain: 5.0
    yaw_gain: 3.5
    yaw_deadband_rad: 0.05
    yaw_speed_limit_rad_s: 1.0
    task_weights: [30.0, 30.0, 100.0]

optimization:
  # BVLS 활성 집합 판정과 반복 상한을 조절하는 수치 설정이다.
  tolerance: 0.0000000001
  iteration_multiplier: 4
  extra_iterations: 4
  barrier_iteration_multiplier: 2
  barrier_extra_iterations: 4

base:
  teleop:
    # 키보드 병진·회전 목표와 평활화 이득이다.
    cruise_speed_m_s: 0.62
    max_speed_m_s: 0.70
    acceleration_gain: 5.0
    brake_gain: 8.0
    yaw_speed_rad_s: 1.6
    yaw_follow_gain: 5.0
    yaw_decay_gain: 8.0
    zero_epsilon: 0.001
  geometry:
    # 각 스워브 모듈의 차체 기준 (x, y) 위치다.
    wheel_positions_m:
      left_wheel: [0.1371, 0.2554]
      right_wheel: [0.1371, -0.2554]
      rear_wheel: [-0.2899, 0.0]
    wheel_radius_m: 0.09
    steering_range_rad: [-6.28, 6.28]
    module_angle_offsets_rad:
      left_wheel: 0.0
      right_wheel: 0.0
      rear_wheel: 0.0
    wheel_speed_limit_rad_s: [-50.0, 50.0]
  control:
    linear_velocity_deadband_m_s: 0.001
    angular_velocity_deadband_rad_s: 0.001
    module_speed_epsilon_m_s: 0.00001
    steering_velocity_limit_rad_s: 8.0
    alignment_angle_threshold_rad: 0.10
    alignment_start_angle_threshold_rad: 0.10
    alignment_start_speed_threshold_rad_s: 0.10
    steering_tolerance_rad: 0.03
    direction_switch_hysteresis_rad: 0.08
    reversal_deceleration_rate: 7.0
    reversal_acceleration_rate: 5.0
    reversal_threshold: 0.05
    drive_acceleration_limit_rad_s2: 80.0
    drive_brake_limit_rad_s2: 3.0
    drive_creep_threshold_rad_s: 0.5
    drive_creep_brake_limit_rad_s2: 0.20

grasp:
  # 손가락 관절 범위에서 열림과 최대 굽힘이 차지하는 비율이다.
  finger_open_fraction: 0.20
  thumb_open_fraction: 0.0
  ring_pinky_max_fraction: 0.35
  # 엄지 CMC 사전 자세와 MCP yaw의 휴식·굽힘 각도다.
  thumb_preshape_rad:
    left: -0.131
    right: -0.131
  thumb_yaw_rest_rad:
    left: 1.309
    right: -1.309
  thumb_yaw_curl_rad:
    left: 2.0326
    right: -2.0326
  # 접촉력 기반 파지 판정의 기본 임계값이다.
  detection:
    minimum_fingers: 2
    minimum_total_force_n: 0.05
    require_thumb: true

ui:
  jog_position_step_m: 0.005
  jog_rotation_step_deg: 2.0
  hand_position_offset_range_m: [-0.35, 0.35]
  hand_rotation_range_deg: [-90.0, 90.0]
  virtual_position_range_m: [-0.2, 1.2]
  move_time_range_s: [0.2, 8.0]
  jog_position_step_range_m: [0.001, 0.050]
  jog_rotation_step_range_deg: [0.5, 15.0]
  windows:
    control:
      title: FFW-SH5 Control Center
      position: [575, 10]
      size: [470, 720]
      visible: true
    diagnostics:
      title: FFW-SH5 Diagnostics
      position: [10, 295]
      size: [650, 390]
      visible: true

render:
  # 두 카메라 프리셋은 lookat, 거리, 방위각, 고도각 순으로 구성한다.
  camera_presets:
    overview:
      lookat: [0.3, 0.0, 1.0]
      distance: 2.2
      azimuth_deg: 120.0
      elevation_deg: -20.0
    hand_closeup:
      lookat: [0.5055, 0.0, 0.85]
      distance: 0.5
      azimuth_deg: 90.0
      elevation_deg: -15.0
  mouse_zoom_scale: 0.05
  gizmo_size: 0.18
  max_scene_geometries: 10000
  collision_overlay:
    collision_geometry_rgba: [0.05, 0.75, 1.0, 0.28]
    penetration_rgba: [1.0, 0.02, 0.02, 1.0]
    unsafe_rgba: [1.0, 0.18, 0.02, 1.0]
    buffer_rgba: [1.0, 0.78, 0.05, 1.0]
    point_radius_m: 0.007
    line_width: 4.0
  # 표시 주파수의 지수 이동 평균에서 이전 값과 새 값의 비율이다.
  frequency_ema_previous_weight: 0.9

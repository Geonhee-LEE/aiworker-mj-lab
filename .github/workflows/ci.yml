name: ci

on:
  push:
    branches: [main, feature/aloha-act-pipeline]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-imitation.txt
            requirements-huggingface.txt
            requirements-dev.txt

      - name: Install headless OpenGL runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgl1 libosmesa6

      - name: Install dependencies
        run: |
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            torch torchvision
          python -m pip install -r requirements-dev.txt

      - name: Static checks
        run: python -m ruff check src scripts tests

      - name: Unit and headless integration tests
        env:
          MUJOCO_GL: osmesa
        run: python -m pytest -q

name: gendoc

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/gendoc.yml'
  # Actions 탭에서 이 작업 흐름을 수동으로 실행할 수 있게 한다.
  workflow_dispatch:

jobs:
  gendoc:
    name: Generate documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write  # mkdocs gh-deploy가 빌드 결과를 gh-pages에 올리는 데 필요하다.

    steps:
      - uses: actions/checkout@v4

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Install python dependencies
        run: python -m pip install mkdocs mkdocs-material

      - name: Generate documentation
        run: cd docs && make build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: ./site/*

      - name: Deploy documentation
        run: cd docs && make deploy
